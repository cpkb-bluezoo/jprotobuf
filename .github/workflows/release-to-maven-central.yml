name: Publish release

# Maven Central: scripts/publish-to-central.sh (build, sign, Central Publisher API).
# GitHub Packages: scripts/publish-to-github-packages.sh (mvn deploy:deploy-file).
# VERSION is auto-detected from pom.xml and cross-checked against build.xml in
# both scripts. Trigger on GitHub Release publish or workflow_dispatch (normally
# on a release tag).
#
# Publishing to Maven Central cannot be undone, so the job only runs for a tag
# (a manual dispatch from a branch is skipped).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Import GPG key
        id: gpg
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Allow loopback pinentry
        run: |
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

      - name: Publish to Maven Central
        run: ./scripts/publish-to-central.sh
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          KEEP_BUNDLE_AT: ${{ github.workspace }}/central-bundle.zip

      - name: Publish to GitHub Packages
        run: ./scripts/publish-to-github-packages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifact for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle
          path: central-bundle.zip
