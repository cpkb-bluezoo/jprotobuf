# Build Javadoc and publish to GitHub Pages.
# Enable in repo Settings > Pages: Source = "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Javadoc
        run: ant javadoc-force

      - name: Stage site
        run: |
          mkdir -p _site/doc
          cp -r doc/. _site/doc/
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>jprotobuf</title></head>
          <body>
            <h1>jprotobuf</h1>
            <p>Protocol Buffers wire-format codec for Java.</p>
            <ul>
              <li><a href="doc/">API Documentation (Javadoc)</a></li>
              <li><a href="https://github.com/cpkb-bluezoo/jprotobuf">GitHub repository</a></li>
            </ul>
          </body></html>
          HTML

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
